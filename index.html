<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>PROJECT DEFENSE — Green Valley</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#142b25;color:#fff;font-family:system-ui}html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}canvas{display:block;touch-action:none}button{touch-action:manipulation}#hud{position:fixed;top:10px;left:10px;display:flex;gap:7px;flex-wrap:wrap}.chip,#tip{background:#173b31e8;border:1px solid #7ba489;border-radius:12px;padding:8px 11px;font-weight:700}#bar{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:#173b31ed;padding:8px;border-radius:16px;max-width:98vw;overflow:auto}button{color:white;background:#306d4b;border:1px solid #9ec29b;border-radius:10px;padding:10px;font-weight:700;white-space:nowrap}button.active{background:#c9ed78;color:#16351e}#tip{position:fixed;top:63px;left:10px;max-width:350px;font-size:12px;font-weight:500}#cameraBtns{position:fixed;right:10px;top:75px;display:grid;gap:5px}@media(max-width:600px){.chip{font-size:11px}#tip{top:105px;max-width:240px}button{font-size:12px;padding:8px}#cameraBtns{top:160px}}</style></head><body><div id="hud"><div class="chip">🌳 PROJECT DEFENSE</div><div class="chip" id="cash">💰 800</div><div class="chip" id="hp">💎 150</div><div class="chip" id="wave">🌊 0/20</div></div><div id="tip">타워 선택 → 잔디 터치하여 설치 · 드래그로 카메라 이동</div><div id="cameraBtns"><button id="rot">↻ 회전</button><button id="zin">＋</button><button id="zout">－</button></div><div id="bar"><button class="active" data-type="soldier">🔫 솔저 200</button><button data-type="sniper">🎯 스나이퍼 350</button><button data-type="minigun">⚡ 미니거너 600</button><button data-type="farm">🌾 농장 300</button><button id="next">▶ 웨이브 시작</button></div><script type="module">
import * as THREE from 'https://esm.sh/three@0.164.1';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xa8d9e9);const ren=new THREE.WebGLRenderer({antialias:true});ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(ren.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x63834f,2.5));const light=new THREE.DirectionalLight(0xfff5da,2);light.position.set(-30,55,25);scene.add(light);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,300);let yaw=.75,zoom=95;const center=new THREE.Vector3();function setCam(){camera.position.set(center.x+Math.sin(yaw)*zoom*.75,zoom*.78,center.z+Math.cos(yaw)*zoom*.75);camera.lookAt(center)}setCam();
const material=c=>new THREE.MeshStandardMaterial({color:c,roughness:.8});const green=material(0x81bb68),dirt=material(0xd6b988),brown=material(0x795339),pine=material(0x348c4d),cyan=material(0x65cfff);
function cube(w,h,d,m,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);scene.add(o);return o}function ball(r,m,x,y,z){const o=new THREE.Mesh(new THREE.SphereGeometry(r,10,8),m);o.position.set(x,y,z);scene.add(o);return o}cube(106,1,106,green,0,-.6,0);
const path=[[-51,-27],[-28,-27],[-28,15],[-6,15],[-6,-18],[20,-18],[20,22],[43,22],[49,30]].map(([x,z])=>new THREE.Vector3(x,.35,z));let lengths=[],full=0;for(let i=1;i<path.length;i++){const a=path[i-1],b=path[i],l=a.distanceTo(b);lengths.push(l);full+=l;const m=cube(9,.16,l+3,dirt,(a.x+b.x)/2,.04,(a.z+b.z)/2);m.rotation.y=Math.atan2(b.x-a.x,b.z-a.z)}
function pos(t){let d=Math.max(0,t)*full;for(let i=0;i<lengths.length;i++){if(d<=lengths[i])return path[i].clone().lerp(path[i+1],d/lengths[i]);d-=lengths[i]}return path[path.length-1].clone()}function pathDist(x,z){let min=1e6;for(let i=1;i<path.length;i++){const a=path[i-1],b=path[i],vx=b.x-a.x,vz=b.z-a.z,t=Math.max(0,Math.min(1,((x-a.x)*vx+(z-a.z)*vz)/(vx*vx+vz*vz)));min=Math.min(min,Math.hypot(x-a.x-t*vx,z-a.z-t*vz))}return min}
const obstacles=[];const rnd=i=>{const n=Math.sin(i*97.4+13)*12345.67;return n-Math.floor(n)};for(let i=0;i<90;i++){const x=rnd(i)*98-49,z=rnd(i+101)*98-49;if(pathDist(x,z)<9||Math.hypot(x,z)<8)continue;const height=3+rnd(i+70)*4;cube(1.5,height,1.5,brown,x,height/2,z);const c=new THREE.Mesh(new THREE.ConeGeometry(3,height*1.2,7),pine);c.position.set(x,height+1,z);scene.add(c);obstacles.push([x,z,3.3])}cube(7,4,7,material(0x4b7baa),47,2,32);ball(3,cyan,47,6,32);cube(7,1,7,material(0x72584a),-48,.7,-27);ball(2.5,material(0x64ec92),-48,3,-27);

// Original low-poly 3D tower art: constructed from primitives, no external image dependency.
function towerArtwork(type,x,z){
 const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
 const add=(geo,color,px,py,pz)=>{const m=new THREE.Mesh(geo,material(color));m.position.set(px,py,pz);g.add(m);return m};
 const B=(w,h,d,c,x,y,z)=>add(new THREE.BoxGeometry(w,h,d),c,x,y,z);
 const S=(r,c,x,y,z)=>add(new THREE.SphereGeometry(r,12,9),c,x,y,z);
 const C=(rt,rb,h,c,x,y,z)=>add(new THREE.CylinderGeometry(rt,rb,h,9),c,x,y,z);
 if(type==='farm'){
  B(5,.5,5,0x91633e,0,.3,0);B(4.4,2.5,4.4,0xf2d77c,0,1.7,0);
  const roof=add(new THREE.ConeGeometry(3.9,2.4,4),0xb9543c,0,4.05,0);roof.rotation.y=Math.PI/4;
  B(1.1,1.5,.15,0x654b31,0,1.3,2.27);
  for(const dx of [-1.8,1.8]){S(.6,0xffd55b,dx,3.2,1.5);C(.14,.18,1.3,0x6c9c43,dx,3.1,1.5)}
 }else{
  const suit=type==='soldier'?0x4479c8:type==='sniper'?0x7560a8:0xc87935;
  B(3.3,.5,3.3,0x354c3b,0,.25,0);B(1.65,2.1,1.1,suit,0,2.1,0);
  B(.6,1.8,.7,0x2c3942,-1.12,2.05,0);B(.6,1.8,.7,0x2c3942,1.12,2.05,0);
  B(.55,1.1,.65,0x34485a,-.5,.9,0);B(.55,1.1,.65,0x34485a,.5,.9,0);
  S(.88,0xf2d9ad,0,3.7,0);B(1.8,.42,1.65,type==='sniper'?0x2c354b:0x526c43,0,4.35,0);
  if(type==='sniper'){B(.36,.38,3.9,0x202b35,.55,2.75,1.75);B(.7,.65,.8,0x4c5565,.55,2.95,.2);S(.28,0x7bd5ee,.55,2.9,3.7)}
  else if(type==='minigun'){for(const ox of [-.38,0,.38])for(const oy of [-.24,.24]){const barrel=C(.12,.12,2.7,0x303c43,.65+ox,2.4+oy,1.6);barrel.rotation.x=Math.PI/2}B(1.25,1.2,1.5,0x4d5a60,.65,2.4,.45)}
  else{B(.42,.45,2.2,0x323e44,.65,2.4,1.3);B(.8,.85,1.2,0x55645a,.65,2.4,.3)}
 }
 return g;
}
const towers=[],enemies=[],shots=[];let cash=800,hp=150,wave=0,running=false,spawnLeft=0,spawnTimer=0,selected='soldier',finished=false;const info={soldier:{cost:200,damage:5,rate:.8,range:12,color:0x5687dd},sniper:{cost:350,damage:20,rate:3,range:28,color:0x9b6bd4},minigun:{cost:600,damage:3,rate:.15,range:15,color:0xd88c3d},farm:{cost:300,damage:0,rate:0,range:0,color:0xe1d169}},limits={soldier:12,sniper:6,minigun:8,farm:5};
function status(){document.querySelector('#cash').textContent='💰 '+cash;document.querySelector('#hp').textContent='💎 '+hp;document.querySelector('#wave').textContent='🌊 '+wave+'/20'}function say(s){document.querySelector('#tip').textContent=s}
function addTower(x,z){if(finished)return;const cfg=info[selected];if(cash<cfg.cost)return say('돈이 부족해!');if(towers.length>=25||towers.filter(t=>t.type===selected).length>=limits[selected])return say('설치 개수 제한!');if(Math.abs(x)>49||Math.abs(z)>49||pathDist(x,z)<7||obstacles.some(o=>Math.hypot(o[0]-x,o[1]-z)<o[2]+3)||towers.some(t=>Math.hypot(t.x-x,t.z-z)<5)||Math.hypot(x-47,z-32)<8)return say('여기에는 설치할 수 없어!');cash-=cfg.cost;towerArtwork(selected,x,z);towers.push({x,z,type:selected,cool:0});status();say('타워 설치 완료!')}
function enemy(){const boss=wave===20&&spawnLeft===1,health=boss?750:22+wave*11,speed=boss?2.3:3+Math.min(wave,12)*.13,p=pos(0);const mesh=ball(boss?3.4:1.5,material(boss?0x496b35:wave%4===0?0x8b7655:0x65cc72),p.x,boss?3.6:1.7,p.z);enemies.push({mesh,t:0,hp:health,speed,boss})}
function begin(){if(running||finished||wave>=20)return;wave++;running=true;spawnLeft=wave===20?15:5+wave*2;spawnTimer=0;for(const t of towers)if(t.type==='farm')cash+=100;status();say('웨이브 '+wave+' 시작!')}
document.querySelector('#next').onclick=begin;document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{selected=b.dataset.type;document.querySelectorAll('[data-type]').forEach(v=>v.classList.toggle('active',v===b));say('선택: '+b.textContent+' · 잔디를 터치해 설치')});document.querySelector('#rot').onclick=()=>{yaw+=Math.PI/2;setCam()};document.querySelector('#zin').onclick=()=>{zoom=Math.max(35,zoom-12);setCam()};document.querySelector('#zout').onclick=()=>{zoom=Math.min(145,zoom+12);setCam()};
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2(),plane=new THREE.Plane(new THREE.Vector3(0,1,0),0);let down=null,lastPlacement=0;document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});ren.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,cx:center.x,cz:center.z};ren.domElement.setPointerCapture(e.pointerId)});ren.domElement.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;if(Math.hypot(dx,dy)>7){const k=zoom/700;center.x=THREE.MathUtils.clamp(down.cx+(-dx*Math.cos(yaw)+dy*Math.sin(yaw))*k,-25,25);center.z=THREE.MathUtils.clamp(down.cz+(dx*Math.sin(yaw)+dy*Math.cos(yaw))*k,-25,25);setCam()}});ren.domElement.addEventListener('pointerup',e=>{if(!down)return;const move=Math.hypot(e.clientX-down.x,e.clientY-down.y);down=null;if(move>8)return;if(e.timeStamp-lastPlacement<360)return;lastPlacement=e.timeStamp;pointer.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(pointer,camera);const point=new THREE.Vector3();if(ray.ray.intersectPlane(plane,point))addTower(point.x,point.z)});ren.domElement.addEventListener('contextmenu',e=>e.preventDefault());ren.domElement.addEventListener('wheel',e=>{zoom=THREE.MathUtils.clamp(zoom+Math.sign(e.deltaY)*6,35,145);setCam()},{passive:true});
let last=performance.now();function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;if(running){spawnTimer-=dt;if(spawnLeft>0&&spawnTimer<=0){enemy();spawnLeft--;spawnTimer=.85}for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];e.t+=e.speed*dt/full;const p=pos(e.t);e.mesh.position.x=p.x;e.mesh.position.z=p.z;if(e.t>=1){hp-=e.boss?30:5;scene.remove(e.mesh);enemies.splice(i,1);status();if(hp<=0){finished=true;running=false;say('게임 오버! 새로고침해서 다시 도전해!')}}}for(const t of towers){if(t.type==='farm')continue;t.cool-=dt;if(t.cool>0)continue;const c=info[t.type],targetEnemy=enemies.find(e=>Math.hypot(e.mesh.position.x-t.x,e.mesh.position.z-t.z)<c.range);if(targetEnemy){t.cool=c.rate;targetEnemy.hp-=c.damage;const spark=ball(.45,material(0xffed7a),targetEnemy.mesh.position.x,targetEnemy.mesh.position.y+1,targetEnemy.mesh.position.z);shots.push({mesh:spark,time:.12});if(targetEnemy.hp<=0){cash+=targetEnemy.boss?500:15+wave;scene.remove(targetEnemy.mesh);enemies.splice(enemies.indexOf(targetEnemy),1);status()}}}if(spawnLeft===0&&enemies.length===0&&!finished){running=false;if(wave===20){finished=true;say('🏆 그린 밸리 쉬움 난이도 클리어!')}else say('웨이브 '+wave+' 완료! 다음 웨이브를 시작해!')}}for(let i=shots.length-1;i>=0;i--){shots[i].time-=dt;if(shots[i].time<=0){scene.remove(shots[i].mesh);shots.splice(i,1)}}ren.render(scene,camera)}requestAnimationFrame(frame);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});status();
</script></body></html>
