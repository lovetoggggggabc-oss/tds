<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#090b24">
  <title>별빛 수호대 — 협동 타워디펜스</title>
  <style>
    :root{color-scheme:dark;--ink:#eef3ff;--muted:#9ba7cb;--panel:rgba(17,21,57,.86);--line:rgba(143,170,255,.22);--cyan:#76e9ff;--violet:#a98cff;--danger:#ff6688}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#07091d;color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",system-ui,sans-serif;overscroll-behavior:none}
    body{display:flex;justify-content:center;background:radial-gradient(circle at 18% 15%,#202354 0,transparent 28%),radial-gradient(circle at 88% 72%,#32194f 0,transparent 30%),#07091d}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.45;background-image:radial-gradient(#fff 0.7px,transparent .8px),radial-gradient(#819dff 1px,transparent 1.1px);background-size:31px 31px,79px 79px;background-position:0 0,17px 13px}
    button{font:inherit;color:inherit;border:0;touch-action:manipulation}.app{width:min(100%,580px);min-height:100dvh;padding:max(8px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:7px;position:relative}
    header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:7px 10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px #0006}.brand small{display:block;color:var(--cyan);font-weight:800;font-size:10px;letter-spacing:.16em}.brand b{font-size:16px}.wave{text-align:center}.wave b{font-size:20px;display:block}.wave span{font-size:11px;color:var(--muted)}.hp{text-align:right}.hp b{color:#ff8da7;font-size:18px}.hp span{display:block;font-size:10px;color:var(--muted)}
    .arena{position:relative;aspect-ratio:10/14.7;max-height:calc(100dvh - 202px);min-height:470px;border-radius:22px;overflow:hidden;border:1px solid #6578c744;background:linear-gradient(180deg,#11163d,#090c29 49%,#10133a);box-shadow:inset 0 0 50px #0008,0 14px 32px #0005}
    .planet{position:absolute;border-radius:50%;filter:blur(.1px);opacity:.35;pointer-events:none}.planet.a{width:55px;height:55px;right:-18px;top:8%;background:radial-gradient(circle at 35% 35%,#93dfff,#624eb9 55%,#1d225e)}.planet.b{width:32px;height:32px;left:12%;bottom:4%;background:#b55e76;box-shadow:inset -9px -7px #54264b}
    #paths,#links,#effects{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.road{fill:none;stroke:#252b55;stroke-width:9;stroke-linecap:round}.roadGlow{fill:none;stroke:#6e7fc5;stroke-opacity:.28;stroke-width:1.5;stroke-dasharray:2 3}.arrow{fill:#8898db;opacity:.6}.goal{fill:#211d4b;stroke:#f1c6ff;stroke-width:.7}.goalPulse{animation:pulse 1.4s infinite;transform-origin:88px 50px}@keyframes pulse{50%{opacity:.35;transform:scale(1.1)}}
    .field{position:absolute;left:19%;width:61%;height:29%;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(3,1fr);gap:5px;padding:4px}.field.p1{top:3%}.field.p2{bottom:3%}.field-label{position:absolute;right:2%;font-size:10px;font-weight:900;letter-spacing:.12em;color:#8698dd}.field-label.one{top:3%}.field-label.two{bottom:3%}
    .slot{position:relative;padding:0;border-radius:10px;border:1px solid rgba(127,150,225,.18);background:rgba(54,64,119,.18);min-width:0;overflow:visible}.slot:after{content:"";position:absolute;inset:20%;border-radius:50%;border:1px dashed #7380b333}.slot.selected{outline:2px solid #fff;outline-offset:1px;background:#8ca5ff33}.slot.support{border-color:#f8d884aa}.slot.support:before{content:"지원";position:absolute;z-index:5;bottom:1px;left:50%;transform:translateX(-50%);font-size:7px;color:#ffe69b}.star{position:absolute;inset:12%;display:grid;place-items:center;filter:drop-shadow(0 0 6px currentColor);font-size:clamp(18px,5vw,28px);line-height:1}.star-level{position:absolute;right:-2px;top:-3px;min-width:15px;height:15px;padding:1px 3px;border-radius:8px;background:#07091d;border:1px solid currentColor;font-size:9px;font-weight:900;display:grid;place-items:center}.constellation .star{font-size:clamp(22px,6vw,32px);animation:pulse 1.5s infinite;color:#ffdf89!important}
    .enemy{position:absolute;width:27px;height:27px;margin:-13.5px;z-index:12;display:grid;place-items:center;border-radius:50%;font-size:16px;filter:drop-shadow(0 2px 4px #000);pointer-events:none}.enemy .bar{position:absolute;left:-3px;right:-3px;top:-6px;height:3px;background:#310d25;border-radius:2px;overflow:hidden}.enemy .bar i{display:block;height:100%;background:#ff5e93}.enemy.boss{width:40px;height:40px;margin:-20px;font-size:27px;box-shadow:0 0 14px #ff68d8}.enemy small{position:absolute;bottom:-9px;font-size:7px;font-weight:bold;white-space:nowrap;text-shadow:0 1px 2px #000}
    .beam{stroke:#aef8ff;stroke-width:.6;filter:drop-shadow(0 0 2px #fff);animation:zap .16s forwards}.link{stroke:#ffd979;stroke-width:.45;stroke-dasharray:1 1;opacity:.8}@keyframes zap{to{opacity:0}}.float{position:absolute;z-index:30;color:#fff;font-size:10px;font-weight:bold;animation:float .65s forwards;pointer-events:none}@keyframes float{to{transform:translateY(-18px);opacity:0}}
    .players{display:grid;grid-template-columns:1fr 1fr;gap:7px}.player{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:7px}.player-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}.player-head b{font-size:12px}.wallet{font-size:10px;color:var(--muted)}.wallet strong{color:#ffe594}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.actions button{padding:7px 2px;border-radius:8px;background:linear-gradient(#46528e,#303867);font-size:10px;font-weight:800;border:1px solid #8191d055}.actions button.primary{background:linear-gradient(#795ad5,#5039a0)}.actions button:disabled{opacity:.32;filter:grayscale(1)}.actions button.active{outline:2px solid #ffe590;background:#7e662b}.hint{position:absolute;z-index:50;left:50%;bottom:4px;transform:translateX(-50%);width:max-content;max-width:92%;padding:6px 11px;border-radius:14px;background:#060819df;border:1px solid #7b88ba;color:#dce5ff;font-size:10px;text-align:center;pointer-events:none;transition:.2s}.overlay{position:absolute;z-index:100;inset:0;background:#07091dee;display:grid;place-items:center;text-align:center;padding:28px}.overlay[hidden]{display:none}.card h1{font-size:30px;margin:0 0 8px}.card p{color:var(--muted)}.card button{padding:12px 26px;border-radius:12px;background:#7156d4;font-weight:900}.boss-alert{position:absolute;top:46%;left:50%;z-index:40;transform:translate(-50%,-50%);font-size:21px;font-weight:900;color:#ffc9ed;text-shadow:0 0 12px #ff42c9;animation:alert 1.6s forwards;pointer-events:none}@keyframes alert{80%{opacity:1}to{opacity:0}}
    @media(max-height:720px){.app{gap:4px}.arena{min-height:430px}.actions button{padding:5px 1px}header{padding:4px 9px}.player{padding:5px}}
  </style>
</head>
<body><main class="app">
  <header><div class="brand"><small>CO-OP DEFENSE</small><b>별빛 수호대</b></div><div class="wave"><b>WAVE <span id="wave">0</span></b><span>다음 웨이브 <strong id="timer">0.0</strong>초</span></div><div class="hp"><b id="hp">♥♥♥♥♥</b><span>공용 HP</span></div></header>
  <section class="arena" id="arena" aria-label="게임 필드">
    <div class="planet a"></div><div class="planet b"></div>
    <svg id="paths" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <path class="road" d="M8 7V50H89 M8 93V50"/><path class="roadGlow" d="M8 7V50H89 M8 93V50"/>
      <path class="arrow" d="M6 28h4L8 33z M6 72h4l-2-5z M40 48v4l5-2z M66 48v4l5-2z"/>
      <circle class="goal goalPulse" cx="89" cy="50" r="7"/><circle class="goal" cx="89" cy="50" r="4"/><text x="89" y="51.5" text-anchor="middle" fill="#fff" font-size="4">✦</text>
    </svg>
    <svg id="links" viewBox="0 0 100 100" preserveAspectRatio="none"></svg><svg id="effects" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
    <span class="field-label one">1P FIELD</span><div class="field p1" id="field-0"></div>
    <span class="field-label two">2P FIELD</span><div class="field p2" id="field-1"></div>
    <div class="hint" id="hint">별을 소환해 공동 도착지를 지키세요!</div>
    <div class="overlay" id="gameover" hidden><div class="card"><h1>우주 방어 실패</h1><p>최고 도달 웨이브 <b id="finalWave">0</b></p><button id="restart">다시 시작</button></div></div>
  </section>
  <section class="players" id="controls"></section>
</main>
<script>
'use strict';
const CONFIG={waveSeconds:15,summonCost:30,swapCost:10,startStarlight:120,startHP:5,tierDamage:[1,1.7,2.8,4.4],monsters:{slime:{name:'어둠 슬라임',icon:'●',hp:100,speed:4.6,reward:1},bug:{name:'암흑 벌레',icon:'◆',hp:70,speed:7,reward:2},drone:{name:'코어 드론',icon:'◉',hp:2500,speed:2.8,reward:30,boss:true},meteor:{name:'운석 괴물',icon:'☄',hp:5000,speed:1.8,reward:50,boss:true}},stars:{blue:{name:'청색',color:'#4d83ff',damage:50,rate:4,range:5,target:'lock'},sky:{name:'하늘색',color:'#74e8ff',damage:75,rate:2,range:7,target:'random'},white:{name:'백색',color:'#fff',damage:100,rate:3.5,range:6,target:'burst'},orange:{name:'주황색',color:'#ffad45',damage:125,rate:1.5,range:4,target:'nearest'},red:{name:'적색',color:'#ff5064',damage:200,rate:1,range:5,target:'highest'}}};
const STAR_KEYS=Object.keys(CONFIG.stars), RECIPE={blue:2,red:1,white:1};
class PlayerResources{constructor(){this.starlight=CONFIG.startStarlight;this.divinity=0}can(n){return this.starlight>=n}spend(n){if(!this.can(n))return false;this.starlight-=n;return true}}
class Enemy{constructor(type,lane,wave){Object.assign(this,CONFIG.monsters[type]);this.type=type;this.lane=lane;this.progress=0;this.maxHp=this.hp*Math.pow(1.12,wave-1);this.hp=this.maxHp;this.dead=false;this.el=document.createElement('div');this.el.className='enemy'+(this.boss?' boss':'');this.el.innerHTML=`<div class="bar"><i></i></div><span>${this.icon}</span><small>${this.boss?this.name:''}</small>`;arena.append(this.el);this.render()}position(){let p=this.progress;if(p<43)return{x:8,y:this.lane===0?7+p:93-p};return{x:8+(p-43)*81/57,y:50}}render(){let p=this.position();this.el.style.left=p.x+'%';this.el.style.top=p.y+'%';this.el.querySelector('i').style.width=Math.max(0,this.hp/this.maxHp*100)+'%'}update(dt){this.progress+=this.speed*dt;if(this.progress>=100){this.dead=true;this.el.remove();game.leak(this)}else this.render()}hit(n,from){this.hp-=n;UIManager.beam(from,this.position());if(this.hp<=0&&!this.dead){this.dead=true;this.el.remove();game.kill(this)}}}
class EnemySpawner{constructor(game){this.game=game;this.queue=[]}wave(n){let boss=WaveManager.isBoss(n);if(boss){let type=n%20===0?'meteor':'drone';this.queue.push({at:0,type,lane:n%2})}else{let count=Math.min(4+Math.floor(n*1.2),25);for(let i=0;i<count;i++)this.queue.push({at:i*.7,type:(i+n)%3===0?'bug':'slime',lane:i%2})}}update(dt){this.queue.forEach(x=>x.at-=dt);while(this.queue[0]&&this.queue[0].at<=0){let x=this.queue.shift();this.game.enemies.push(new Enemy(x.type,x.lane,this.game.wave.wave))}}}
class WaveManager{constructor(game){this.game=game;this.wave=0;this.left=.7}static isBoss(n){return(n<=40&&n%10===0)||(n>=45&&n<=60&&n%5===0)||(n>=62&&n%2===0)}update(dt){this.left-=dt;if(this.left<=0){this.wave++;this.left+=CONFIG.waveSeconds;this.game.spawner.wave(this.wave);if(WaveManager.isBoss(this.wave))UIManager.alert(`⚠ BOSS WAVE ${this.wave}`)}}}
class Star{constructor(type,tier=1){this.type=type;this.tier=tier;this.cooldown=Math.random()*.3;this.burstLeft=3;this.lock=null;this.constellation=null;this.support=false}data(){return CONFIG.stars[this.type]}}
class Targeting{static choose(star,enemies,pos){let targets=enemies.filter(e=>!e.dead&&Targeting.dist(pos,e.position())<=star.data().range*6.3);if(!targets.length)return null;if(star.data().target==='lock'&&targets.includes(star.lock))return star.lock;if(star.data().target==='random')return targets[Math.floor(Math.random()*targets.length)];if(star.data().target==='nearest')return targets.sort((a,b)=>Targeting.dist(pos,a.position())-Targeting.dist(pos,b.position()))[0];if(star.data().target==='highest')return targets.sort((a,b)=>b.hp-a.hp)[0];return targets.sort((a,b)=>b.progress-a.progress)[0]}static dist(a,b){return Math.hypot(a.x-b.x,(a.y-b.y)*.68)}}
class Constellation{constructor(owner,center,members){this.owner=owner;this.center=center;this.members=members;this.cooldown=0;members.forEach(i=>owner.stars[i].support=i!==center);owner.stars[center].constellation=this}attack(dt){this.cooldown-=dt;if(this.cooldown>0)return;let target=Targeting.choose({data:()=>({range:9,target:'highest'})},game.enemies,this.owner.pos(this.center));if(target){let power=this.members.reduce((s,i)=>s+this.owner.stars[i].tier,0)*150;target.hit(power,this.owner.pos(this.center));this.cooldown=.55}}release(){this.members.forEach(i=>{this.owner.stars[i].support=false;this.owner.stars[i].constellation=null})}}
class StarManager{constructor(player,field){this.player=player;this.field=field;this.stars=Array(15).fill(null);this.selected=[];this.swapMode=false;for(let i=0;i<15;i++){let b=document.createElement('button');b.className='slot';b.dataset.index=i;b.setAttribute('aria-label',`빈 슬롯 ${i+1}`);b.addEventListener('pointerup',()=>this.tap(i));field.append(b)}}pos(i){let el=this.field.children[i],a=arena.getBoundingClientRect(),r=el.getBoundingClientRect();return{x:(r.left+r.width/2-a.left)/a.width*100,y:(r.top+r.height/2-a.top)/a.height*100}}summon(){let empty=this.stars.map((s,i)=>s?null:i).filter(i=>i!==null);if(!empty.length)return UIManager.hint('빈 슬롯이 없습니다.');if(!this.player.resources.spend(CONFIG.summonCost))return UIManager.hint('별빛이 부족합니다.');let i=empty[Math.floor(Math.random()*empty.length)];this.stars[i]=new Star(STAR_KEYS[Math.floor(Math.random()*STAR_KEYS.length)]);this.selectOnly(i);game.render()}tap(i){if(!this.stars[i])return;if(this.swapMode&&this.selected.length===1&&this.selected[0]!==i)return SwapSystem.execute(this,this.selected[0],i);let at=this.selected.indexOf(i);if(at>=0)this.selected.splice(at,1);else this.selected.push(i);this.swapMode=false;game.render()}selectOnly(i){this.selected=[i]}update(dt){this.stars.forEach((s,i)=>{if(!s||s.support)return;if(s.constellation){s.constellation.attack(dt);return} s.cooldown-=dt;if(s.cooldown>0)return;let t=Targeting.choose(s,game.enemies,this.pos(i));if(t){s.lock=t;let damage=s.data().damage*CONFIG.tierDamage[s.tier-1];t.hit(damage,this.pos(i));if(s.data().target==='burst'){s.burstLeft--;if(s.burstLeft>0)s.cooldown=.16;else{s.burstLeft=3;s.cooldown=2}}else s.cooldown=1/s.data().rate}})}render(){[...this.field.children].forEach((el,i)=>{let s=this.stars[i];el.className='slot'+(this.selected.includes(i)?' selected':'')+(s&&s.support?' support':'')+(s&&s.constellation?' constellation':'');el.innerHTML=s?`<span class="star" style="color:${s.data().color}">✦<b class="star-level">${s.tier}</b></span>`:'';el.setAttribute('aria-label',s?`${s.data().name} 별 ${s.tier}단계`:`빈 슬롯 ${i+1}`)})}}
class MergeSystem{static execute(m){if(m.selected.length!==1)return UIManager.hint('합칠 별 하나를 선택하세요.');let a=m.selected[0],s=m.stars[a];if(s.constellation||s.support||s.tier>=4)return UIManager.hint('이 별은 합칠 수 없습니다.');let b=m.stars.findIndex((x,i)=>i!==a&&x&&!x.support&&!x.constellation&&x.type===s.type&&x.tier===s.tier);if(b<0)return UIManager.hint('같은 종류·단계의 별이 필요합니다.');s.tier++;m.stars[b]=null;m.selected=[];UIManager.hint(`${s.data().name} 별 ${s.tier}단계 완성!`);game.render()}}
class SwapSystem{static begin(m){if(!m.player.resources.can(CONFIG.swapCost))return UIManager.hint('별빛이 부족합니다.');if(m.selected.length!==1)return UIManager.hint('교환할 별을 먼저 선택하세요.');m.swapMode=true;UIManager.hint('위치를 바꿀 다른 별을 선택하세요.');game.render()}static execute(m,a,b){if(!m.stars[b]||m.stars[a].support||m.stars[b].support||m.stars[a].constellation||m.stars[b].constellation)return UIManager.hint('별자리 구성원은 교환할 수 없습니다.');if(!m.player.resources.spend(CONFIG.swapCost))return;m.stars[a]=[m.stars[b],m.stars[b]=m.stars[a]][0];m.selected=[];m.swapMode=false;game.render()}}
class ZodiacSystem{static create(m){let picks=m.selected;if(picks.length!==4)return UIManager.hint('중심 별부터 재료 4개를 선택하세요.');let counts={};picks.forEach(i=>{let s=m.stars[i];if(s)counts[s.type]=(counts[s.type]||0)+1});if(Object.keys(RECIPE).some(k=>counts[k]!==RECIPE[k])||picks.some(i=>m.stars[i].support||m.stars[i].constellation))return UIManager.hint('새벽: 청색×2 + 적색×1 + 백색×1');new Constellation(m,picks[0],[...picks]);m.selected=[];UIManager.hint('✨ 새벽의 별자리 완성!');game.render()}static release(m){let c=m.stars.find(s=>s&&s.constellation)?.constellation;if(!c)return UIManager.hint('해제할 별자리가 없습니다.');if(m.player.resources.divinity<1)return UIManager.hint('신성 1이 필요합니다.');m.player.resources.divinity--;c.release();UIManager.hint('별자리를 해제했습니다.');game.render()}}
class UIManager{static hint(t){hint.textContent=t;clearTimeout(this.ht);this.ht=setTimeout(()=>hint.textContent='별을 선택하고 행동 버튼을 사용하세요.',2200)}static alert(t){let d=document.createElement('div');d.className='boss-alert';d.textContent=t;arena.append(d);setTimeout(()=>d.remove(),1700)}static beam(a,b){effects.insertAdjacentHTML('beforeend',`<line class="beam" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`);setTimeout(()=>effects.firstElementChild?.remove(),170)}static render(g){wave.textContent=g.wave.wave;timer.textContent=Math.max(0,g.wave.left).toFixed(1);hp.textContent='♥'.repeat(g.hp)+'♡'.repeat(CONFIG.startHP-g.hp);let drawn=new Set,lines=[];g.players.forEach(p=>p.manager.stars.forEach(s=>{let c=s?.constellation;if(c&&!drawn.has(c)){drawn.add(c);let a=c.owner.pos(c.center);c.members.filter(i=>i!==c.center).forEach(i=>{let b=c.owner.pos(i);lines.push(`<line class="link" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`)})}}));links.innerHTML=lines.join('');g.players.forEach((p,i)=>{p.manager.render();let box=controls.children[i];box.querySelector('.wallet').innerHTML=`별빛 <strong>✦ ${p.resources.starlight}</strong> · 신성 <strong>◇ ${p.resources.divinity}</strong>`;box.querySelector('[data-act=swap]').disabled=!p.resources.can(CONFIG.swapCost);box.querySelector('[data-act=summon]').disabled=!p.resources.can(CONFIG.summonCost)||p.manager.stars.every(Boolean);box.querySelector('[data-act=swap]').classList.toggle('active',p.manager.swapMode)})}}
class GameManager{constructor(){this.last=0;this.running=true;this.hp=CONFIG.startHP;this.enemies=[];this.wave=new WaveManager(this);this.spawner=new EnemySpawner(this);this.players=[0,1].map(i=>{let p={resources:new PlayerResources};p.manager=new StarManager(p,document.getElementById(`field-${i}`));return p});this.buildControls();this.render();requestAnimationFrame(t=>this.loop(t))}buildControls(){this.players.forEach((p,i)=>{let el=document.createElement('div');el.className='player';el.innerHTML=`<div class="player-head"><b>${i+1}P 마법사</b><span class="wallet"></span></div><div class="actions"><button class="primary" data-act="summon">✦ 소환 30</button><button data-act="merge">합성</button><button data-act="swap">교환 10</button><button data-act="zodiac">조디악</button><button data-act="release">해제 ◇1</button></div>`;controls.append(el);el.querySelector('[data-act=summon]').onclick=()=>p.manager.summon();el.querySelector('[data-act=merge]').onclick=()=>MergeSystem.execute(p.manager);el.querySelector('[data-act=swap]').onclick=()=>SwapSystem.begin(p.manager);el.querySelector('[data-act=zodiac]').onclick=()=>ZodiacSystem.create(p.manager);el.querySelector('[data-act=release]').onclick=()=>ZodiacSystem.release(p.manager)})}kill(e){this.players.forEach(p=>{p.resources.starlight+=e.reward;if(e.boss)p.resources.divinity++});this.render()}leak(){if(--this.hp<=0){this.running=false;finalWave.textContent=this.wave.wave;gameover.hidden=false}this.render()}loop(t){if(!this.last)this.last=t;let dt=Math.min((t-this.last)/1000,.05);this.last=t;if(this.running){this.wave.update(dt);this.spawner.update(dt);this.enemies.forEach(e=>e.update(dt));this.enemies=this.enemies.filter(e=>!e.dead);this.players.forEach(p=>p.manager.update(dt));this.render()}requestAnimationFrame(x=>this.loop(x))}render(){UIManager.render(this)}}
let game=new GameManager();restart.onclick=()=>location.reload();document.addEventListener('contextmenu',e=>e.preventDefault());
</script></body></html>
