<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#090b24" />
    <title>별빛 수호대 — 협동 타워디펜스</title>
    <!-- Keep deployed iOS browsers from reusing the pre-portrait stylesheet. -->
    <link rel="stylesheet" href="styles.css?v=28" />
  </head>
  <body>
    <main class="app" id="game-shell">
      <header>
        <div class="brand"><small>CO-OP DEFENSE</small><b>별빛 수호대</b></div>
        <div class="wave">
          <b>WAVE <span id="wave">0</span></b
          ><span>다음 웨이브 <strong id="timer">0.0</strong>초</span>
        </div>
        <div class="resources" aria-label="플레이어별 보유 자원">
          <span>2P ✦<b id="starlight2">0</b> ◇<b id="divinity2">0</b></span>
          <span>1P ✦<b id="starlight1">0</b> ◇<b id="divinity1">0</b></span>
        </div>
        <div class="hp">
          <b id="hp">HP 5000/5000</b><span>1P·2P 공용</span
          ><button class="speed" id="speed" aria-label="게임 속도 변경">
            1× 속도
          </button>
        </div>
      </header>
      <aside class="star-info" id="starInfo" hidden aria-live="polite"></aside>
      <section class="arena" id="arena" aria-label="게임 필드">
        <div class="planet a"></div>
        <div class="planet b"></div>
        <svg
          id="paths"
          viewBox="0 0 100 100"
          preserveAspectRatio="none"
          aria-hidden="true"
        >
          <path class="roadGlow" d="M8 7V50H89 M8 93V50" />
          <path class="road" d="M8 7V50H89 M8 93V50" />
          <path
            class="arrow"
            d="M6 28h4L8 33z M6 72h4l-2-5z M40 48v4l5-2z M66 48v4l5-2z"
          />
          <circle class="start" cx="8" cy="7" r="3.3" />
          <text class="start-label" x="8" y="8.1">2P</text>
          <circle class="start" cx="8" cy="93" r="3.3" />
          <text class="start-label" x="8" y="94.1">1P</text>
          <circle class="goal goalPulse" cx="89" cy="50" r="7" />
          <circle class="goal" cx="89" cy="50" r="4" />
          <text x="89" y="51.5" text-anchor="middle" fill="#fff" font-size="4">
            ✦
          </text>
        </svg>
        <svg id="links" viewBox="0 0 100 100" preserveAspectRatio="none"></svg
        ><svg id="ranges" viewBox="0 0 100 100" preserveAspectRatio="none"></svg
        ><svg
          id="effects"
          viewBox="0 0 100 100"
          preserveAspectRatio="none"
        ></svg>
        <div id="rangeIndicator" class="range-indicator" hidden></div>
        <div id="contextActions" class="context-actions" hidden></div>
        <div class="arena-layout">
          <section class="field-zone" aria-label="2P 배치 영역">
            <span class="field-label">2P FIELD</span>
            <div class="field p2" id="field-1"></div>
          </section>
          <div class="path-zone" aria-hidden="true"></div>
          <section class="field-zone" aria-label="1P 배치 영역">
            <span class="field-label">1P FIELD</span>
            <div class="field p1" id="field-0"></div>
          </section>
        </div>
        <div class="hint" id="hint" aria-live="polite">별을 소환해 공동 도착지를 지키세요!</div>
        <div id="dawnMoon" class="dawn-moon" hidden aria-hidden="true">
          <svg viewBox="0 0 200 200" role="presentation">
            <defs>
              <filter
                id="moonGlow"
                x="-80%"
                y="-80%"
                width="260%"
                height="260%"
              >
                <feGaussianBlur stdDeviation="7" result="blur" />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
              <linearGradient id="moonLight" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#fff" />
                <stop offset="1" stop-color="#9edcff" />
              </linearGradient>
            </defs>
            <path
              d="M137 25a77 77 0 1 0 19 123A65 65 0 1 1 137 25Z"
              fill="url(#moonLight)"
              filter="url(#moonGlow)"
            />
          </svg>
        </div>
        <div class="overlay" id="gameover" hidden>
          <div class="card">
            <h1>우주 방어 실패</h1>
            <p>최고 도달 웨이브 <b id="finalWave">0</b></p>
            <button id="restart">다시 시작</button>
          </div>
        </div>
      </section>
      <section
        class="zodiac-codex"
        id="zodiacCodex"
        role="dialog"
        aria-modal="true"
        aria-labelledby="zodiacCodexTitle"
        hidden
      >
        <div class="codex-panel">
          <header class="codex-header">
            <div><small>CELESTIAL ARCHIVE</small><h2 id="zodiacCodexTitle">별자리 도감</h2></div>
            <button type="button" data-close-codex aria-label="별자리 도감 닫기">×</button>
          </header>
          <div id="zodiacCodexList" class="codex-list" tabindex="0"></div>
        </div>
      </section>
      <nav class="control-deck" id="controls" aria-label="플레이어 게임 조작">
        <section class="game-controls" data-player="0" aria-label="1P 게임 조작">
          <b class="player-badge">1P</b>
          <button type="button" class="zodiac-cancel" data-act="zodiac-cancel" hidden>조디악 실행 취소</button>
          <button type="button" class="primary" data-act="summon">별 소환 30</button>
          <button type="button" data-act="zodiac">조디악</button>
          <button type="button" class="codex-button" data-act="codex">별자리 도감</button>
        </section>
      </nav>
    </main>
    <script src="game.js?v=28" defer></script>
  </body>
</html>
